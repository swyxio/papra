name: Chrome download resume

on:
  schedule:
    - cron: '41 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm --filter @papra/root --filter @papra/worker... install --frozen-lockfile
      - run: pnpm --filter @papra/search-parser build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @papra/worker exec vitest run --config scripts/vitest.download-resume.config.ts
